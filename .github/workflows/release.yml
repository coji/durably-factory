name: Release npm package

# A push to main lets release-please keep a release PR up to date. Merging
# that PR bumps package.json, writes CHANGELOG.md and creates the vX.Y.Z tag
# and GitHub Release; this same workflow then builds and publishes it, since
# a tag made with the workflow's own token starts no other workflow. npm's
# Trusted Publisher is bound to this file, so publishing must stay here.
# A manual run publishes an existing tag again, to recover a failed publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # A manual run skips release-please; a push to main builds only when it
    # just created a release.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false

      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          validation_home="$(mktemp -d)"
          HOME="$validation_home" pnpm validate

      - name: Test the release tarball
        run: |
          pnpm pack --out "$RUNNER_TEMP/factory.tgz"
          pnpm exec node scripts/smoke-package.mjs "$RUNNER_TEMP/factory.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/factory.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}

      - name: Publish the verified tarball
        run: npm publish "$RUNNER_TEMP/factory.tgz" --ignore-scripts
